<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Are They Dead?</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .person-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    .person-selector button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 2.5rem;
      cursor: pointer;
      padding: 10px;
      transition: color 0.2s;
    }

    .person-selector button:hover {
      color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .status {
      font-size: 5rem;
      font-weight: bold;
      margin: 20px 0;
    }

    .age {
      font-size: 1.25rem;
      color: #bbb;
      margin-top: 15px;
      line-height: 1.6;
    }

    .subtitle {
      color: #777;
      font-size: 0.9rem;
      margin-top: 20px;
    }

    .updated {
      margin-top: 25px;
      color: #555;
      font-size: 0.75rem;
    }

  </style>

</head>

<body>

  <div class="container">

    <div class="person-selector">

      <button onclick="previousPerson()">←</button>

      <h1 id="name">Jamie</h1>

      <button onclick="nextPerson()">→</button>

    </div>

    <div class="status" id="status"></div>

    <div class="age" id="age"></div>

    <div class="subtitle">
      Extremely reliable information
    </div>

    <div class="updated">
      Last checked: Definitely
    </div>

  </div>


  <script>

    // ==========================================
    // PEOPLE
    // ==========================================

    const people = [

      {
        name: "Jamie",

        isDead: "NO",

        birthDate: new Date(
          2012,
          9,
          7,
          13,
          0,
          0
        )
      },

      {
        name: "Zana",

        isDead: "NO",

        birthDate: new Date(
          2013,
          1,
          12,
          17,
          0,
          0
        )
      }

    ];


    // ==========================================
    // CURRENT PERSON
    // ==========================================

    let currentPerson = 0;


    // ==========================================
    // GET HTML ELEMENTS
    // ==========================================

    const name = document.getElementById("name");

    const status = document.getElementById("status");

    const age = document.getElementById("age");


    // ==========================================
    // CALCULATE AGE
    // ==========================================

    function calculateAge(birthDate) {

      const now = new Date();

      let years =
        now.getFullYear() - birthDate.getFullYear();


      const birthdayThisYear = new Date(

        now.getFullYear(),

        birthDate.getMonth(),

        birthDate.getDate(),

        birthDate.getHours(),

        birthDate.getMinutes(),

        birthDate.getSeconds()

      );


      if (now < birthdayThisYear) {

        years--;

      }


      const afterYears = new Date(

        birthDate.getFullYear() + years,

        birthDate.getMonth(),

        birthDate.getDate(),

        birthDate.getHours(),

        birthDate.getMinutes(),

        birthDate.getSeconds()

      );


      let months = 0;

      let monthDate = new Date(afterYears);


      while (true) {

        const nextMonth = new Date(

          monthDate.getFullYear(),

          monthDate.getMonth() + 1,

          monthDate.getDate(),

          birthDate.getHours(),

          birthDate.getMinutes(),

          birthDate.getSeconds()

        );


        if (nextMonth <= now) {

          monthDate = nextMonth;

          months++;

        } else {

          break;

        }

      }


      let remainingTime = now - monthDate;


      const millisecondsPerHour =
        1000 * 60 * 60;

      const millisecondsPerDay =
        millisecondsPerHour * 24;

      const millisecondsPerWeek =
        millisecondsPerDay * 7;


      const weeks = Math.floor(

        remainingTime / millisecondsPerWeek

      );


      remainingTime -=
        weeks * millisecondsPerWeek;


      const days = Math.floor(

        remainingTime / millisecondsPerDay

      );


      remainingTime -=
        days * millisecondsPerDay;


      const hours = Math.floor(

        remainingTime / millisecondsPerHour

      );


      age.textContent =

        `${people[currentPerson].name} Is ` +

        `${years} years ${months} months ` +

        `${weeks} weeks ${days} days ` +

        `${hours} hours old.`;

    }


    // ==========================================
    // DISPLAY CURRENT PERSON
    // ==========================================

    function displayPerson() {

      const person = people[currentPerson];


      name.textContent = person.name;


      if (person.isDead === "YES") {

        status.textContent = "YES";

        status.style.color = "#ff5c5c";

      } else {

        status.textContent = "NO";

        status.style.color = "#45d483";

      }


      calculateAge(person.birthDate);

    }


    // ==========================================
    // NEXT PERSON
    // ==========================================

    function nextPerson() {

      currentPerson++;


      if (currentPerson >= people.length) {

        currentPerson = 0;

      }


      displayPerson();

    }


    // ==========================================
    // PREVIOUS PERSON
    // ==========================================

    function previousPerson() {

      currentPerson--;


      if (currentPerson < 0) {

        currentPerson = people.length - 1;

      }


      displayPerson();

    }


    // ==========================================
    // START
    // ==========================================

    displayPerson();


    // Update every minute

    setInterval(

      displayPerson,

      60 * 1000

    );

  </script>

</body>

</html>
