<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Is He Dead?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .status {
      font-size: 5rem;
      font-weight: bold;
      color: #45d483;
      margin: 20px 0;
    }

    .subtitle {
      color: #777;
      font-size: 0.9rem;
    }

    .counters {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 30px;
    }

    .counter {
      background: #191919;
      border: 1px solid #292929;
      border-radius: 8px;
      padding: 12px 25px;
      min-width: 100px;
    }

    .number {
      display: block;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .yes {
      color: #ff5c5c;
    }

    .no {
      color: #45d483;
    }

    button {
      margin-top: 25px;
      padding: 8px 16px;

      background: #191919;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 6px;

      cursor: pointer;
    }

    button:hover {
      color: white;
      border-color: #45d483;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Is He Dead?</h1>

    <div class="status" id="status">NO</div>

    <div class="subtitle">Extremely reliable information</div>

    <div class="counters">
      <div class="counter">
        <span class="number yes" id="yesCount">0</span>
        YES
      </div>

      <div class="counter">
        <span class="number no" id="noCount">0</span>
        NO
      </div>
    </div>

    <button onclick="vote()">Vote</button>
  </div>

  <script>
    let yes = 0;
    let no = 0;

    function vote() {
      if (Math.random() < 0.5) {
        yes++;
      } else {
        no++;
      }

      document.getElementById("yesCount").textContent = yes;
      document.getElementById("noCount").textContent = no;

      const status = document.getElementById("status");

      if (yes > no) {
        status.textContent = "YES";
        status.style.color = "#ff5c5c";
      } else {
        status.textContent = "NO";
        status.style.color = "#45d483";
      }
    }
  </script>

</body>
</html>
