<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Are They Dead?</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
    }

    .question {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .person-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    .person-selector button {
      background: none;
      border: none;
      color: #aaa;
      font-size: 2.5rem;
      cursor: pointer;
      padding: 10px;
      transition: color 0.2s;
    }

    .person-selector button:hover {
      color: #fff;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .status {
      font-size: 5rem;
      font-weight: bold;
      margin: 20px 0;
    }

    .age {
      font-size: 1.25rem;
      color: #bbb;
      margin-top: 15px;
      line-height: 1.6;
    }

    .countdown {
      font-size: 1.2rem;
      color: #ccc;
      margin-top: 20px;
    }

    .countdown-label {
      font-size: 1.2rem;
      color: #bbb;
      margin-top: 20px;
      margin-bottom: 5px;
    }

    .countdown-bar {
      width: 100%;
      max-width: 600px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      margin: 10px auto 0;
      overflow: hidden;
    }

    .countdown-fill {
      height: 100%;
      width: 100%;
      background: #45d483;
      border-radius: 10px;
      transition: width 1s linear, background 0.3s;
    }

    /* ==========================================
       GOON COUNTER
       ========================================== */

    .goon-counter {
      position: absolute;

      right: 30px;
      top: 30px;

      width: 180px;

      padding: 15px;

      background: #1c1c1c;

      border: 1px solid #333;

      border-radius: 10px;

      text-align: center;
    }

    .goon-title {
      color: #aaa;

      font-size: 1rem;

      margin-bottom: 5px;
    }

    .goon-number {
      color: #45d483;

      font-size: 2.5rem;

      font-weight: bold;
    }

    .goon-limit {
      color: #666;

      font-size: 0.8rem;
    }

    .subtitle {
      color: #777;
      font-size: 0.9rem;
      margin-top: 20px;
    }

    .updated {
      margin-top: 25px;
      color: #555;
      font-size: 0.75rem;
    }

    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 700px) {

      .goon-counter {
        position: static;

        margin: 25px auto 0;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <!-- ==========================================
         QUESTION
         ========================================== -->

    <div class="question">
      Is he dead?
    </div>


    <!-- ==========================================
         PERSON SELECTOR
         ========================================== -->

    <div class="person-selector">

      <button onclick="previousPerson()">←</button>

      <h1 id="name">Jamie</h1>

      <button onclick="nextPerson()">→</button>

    </div>


    <!-- ==========================================
         STATUS
         ========================================== -->

    <div class="status" id="status"></div>


    <!-- ==========================================
         AGE
         ========================================== -->

    <div class="age" id="age"></div>


    <!-- ==========================================
         DEATH COUNTDOWN
         ========================================== -->

    <div class="countdown-label">
      Left to live:
    </div>

    <div class="countdown" id="countdown"></div>

    <div class="countdown-bar">

      <div
        class="countdown-fill"
        id="countdownFill">
      </div>

    </div>


    <!-- ==========================================
         GOON COUNTER
         ========================================== -->

    <div class="goon-counter">

      <div class="goon-title">
        Goon Counter
      </div>

      <div class="goon-number" id="goonNumber">
        0
      </div>

      <div class="goon-limit">
        / 500
      </div>

    </div>


    <!-- ==========================================
         SUBTITLE
         ========================================== -->

    <div class="subtitle">
      Extremely reliable information
    </div>


    <div class="updated">
      Last checked: Definitely
    </div>

  </div>


  <script>

    // ==========================================
    // PEOPLE
    // ==========================================

    const people = [

      {
        name: "Jamie",

        isDead: "NO",

        birthDate: new Date(
          2012,
          9,
          7,
          13,
          0,
          0
        ),

        deathDate: new Date(
          2056,
          7,
          11,
          6,
          0,
          45
        )
      },


      {
        name: "Zana",

        isDead: "NO",

        birthDate: new Date(
          2013,
          1,
          12,
          17,
          0,
          0
        ),

        deathDate: null
      }

    ];


    // ==========================================
    // CURRENT PERSON
    // ==========================================

    let currentPerson = 0;


    // ==========================================
    // GET HTML ELEMENTS
    // ==========================================

    const name =
      document.getElementById("name");

    const status =
      document.getElementById("status");

    const age =
      document.getElementById("age");

    const countdown =
      document.getElementById("countdown");

    const countdownFill =
      document.getElementById("countdownFill");

    const goonNumber =
      document.getElementById("goonNumber");


    // ==========================================
    // CALCULATE AGE
    // ==========================================

    function calculateAge(birthDate) {

      const now = new Date();

      let years =
        now.getFullYear() -
        birthDate.getFullYear();


      const birthdayThisYear = new Date(

        now.getFullYear(),

        birthDate.getMonth(),

        birthDate.getDate(),

        birthDate.getHours(),

        birthDate.getMinutes(),

        birthDate.getSeconds()

      );


      if (now < birthdayThisYear) {

        years--;

      }


      const afterYears = new Date(

        birthDate.getFullYear() + years,

        birthDate.getMonth(),

        birthDate.getDate(),

        birthDate.getHours(),

        birthDate.getMinutes(),

        birthDate.getSeconds()

      );


      let months = 0;

      let monthDate =
        new Date(afterYears);


      while (true) {

        const nextMonth = new Date(

          monthDate.getFullYear(),

          monthDate.getMonth() + 1,

          monthDate.getDate(),

          birthDate.getHours(),

          birthDate.getMinutes(),

          birthDate.getSeconds()

        );


        if (nextMonth <= now) {

          monthDate = nextMonth;

          months++;

        } else {

          break;

        }

      }


      let remainingTime =
        now - monthDate;


      const millisecondsPerHour =
        1000 * 60 * 60;

      const millisecondsPerDay =
        millisecondsPerHour * 24;

      const millisecondsPerWeek =
        millisecondsPerDay * 7;


      const weeks = Math.floor(

        remainingTime /
        millisecondsPerWeek

      );


      remainingTime -=
        weeks * millisecondsPerWeek;


      const days = Math.floor(

        remainingTime /
        millisecondsPerDay

      );


      remainingTime -=
        days * millisecondsPerDay;


      const hours = Math.floor(

        remainingTime /
        millisecondsPerHour

      );


      age.textContent =

        `${people[currentPerson].name} Is ` +

        `${years} years ${months} months ` +

        `${weeks} weeks ${days} days ` +

        `${hours} hours old.`;

    }


    // ==========================================
    // DEATH COUNTDOWN
    // ==========================================

    function updateCountdown() {

      const person =
        people[currentPerson];


      // No death date

      if (!person.deathDate) {

        countdown.textContent =
          "No death countdown.";

        countdownFill.style.width =
          "0%";

        return;

      }


      const now = new Date();


      let remainingTime =
        person.deathDate - now;


      // ==========================================
      // DEATH DATE REACHED
      // ==========================================

      if (remainingTime <= 0) {

        countdown.textContent =
          "TIME'S UP";

        countdownFill.style.width =
          "0%";

        countdownFill.style.background =
          "#ff5c5c";

        status.textContent =
          "YES";

        status.style.color =
          "#ff5c5c";

        return;

      }


      // ==========================================
      // YEARS
      // ==========================================

      let years =
        person.deathDate.getFullYear() -
        now.getFullYear();


      const deathDateThisYear =
        new Date(

          now.getFullYear(),

          person.deathDate.getMonth(),

          person.deathDate.getDate(),

          person.deathDate.getHours(),

          person.deathDate.getMinutes(),

          person.deathDate.getSeconds()

        );


      if (now >= deathDateThisYear) {

        years--;

      }


      // ==========================================
      // MONTHS
      // ==========================================

      const afterYears =
        new Date(

          now.getFullYear() + years,

          now.getMonth(),

          now.getDate(),

          now.getHours(),

          now.getMinutes(),

          now.getSeconds()

        );


      let months = 0;

      let monthDate =
        new Date(afterYears);


      while (true) {

        const nextMonth =
          new Date(

            monthDate.getFullYear(),

            monthDate.getMonth() + 1,

            monthDate.getDate(),

            monthDate.getHours(),

            monthDate.getMinutes(),

            monthDate.getSeconds()

          );


        if (
          nextMonth <= person.deathDate
        ) {

          monthDate =
            nextMonth;

          months++;

        } else {

          break;

        }

      }


      // ==========================================
      // WEEKS / DAYS / HOURS / MINUTES / SECONDS
      // ==========================================

      remainingTime =
        person.deathDate - monthDate;


      const millisecondsPerSecond =
        1000;

      const millisecondsPerMinute =
        millisecondsPerSecond * 60;

      const millisecondsPerHour =
        millisecondsPerMinute * 60;

      const millisecondsPerDay =
        millisecondsPerHour * 24;

      const millisecondsPerWeek =
        millisecondsPerDay * 7;


      const weeks = Math.floor(

        remainingTime /
        millisecondsPerWeek

      );


      remainingTime -=
        weeks * millisecondsPerWeek;


      const days = Math.floor(

        remainingTime /
        millisecondsPerDay

      );


      remainingTime -=
        days * millisecondsPerDay;


      const hours = Math.floor(

        remainingTime /
        millisecondsPerHour

      );


      remainingTime -=
        hours * millisecondsPerHour;


      const minutes = Math.floor(

        remainingTime /
        millisecondsPerMinute

      );


      remainingTime -=
        minutes * millisecondsPerMinute;


      const seconds = Math.floor(

        remainingTime /
        millisecondsPerSecond

      );


      // ==========================================
      // DISPLAY COUNTDOWN
      // ==========================================

      countdown.textContent =

        `${years} years ` +
        `${months} months ` +
        `${weeks} weeks ` +
        `${days} days ` +
        `${hours} hours ` +
        `${minutes} minutes ` +
        `${seconds} seconds`;


      // ==========================================
      // UPDATE BAR
      // ==========================================

      const totalTime =
        person.deathDate -
        person.birthDate;


      const percentage =
        (person.deathDate - now) /
        totalTime * 100;


      countdownFill.style.width =

        Math.max(
          0,
          Math.min(100, percentage)
        ) + "%";


      // ==========================================
      // BAR COLOR
      // ==========================================

      if (percentage <= 10) {

        countdownFill.style.background =
          "#ff5c5c";

      } else if (percentage <= 25) {

        countdownFill.style.background =
          "#ffb347";

      } else {

        countdownFill.style.background =
          "#45d483";

      }

    }


    // ==========================================
    // DISPLAY CURRENT PERSON
    // ==========================================

    function displayPerson() {

      const person =
        people[currentPerson];


      name.textContent =
        person.name;


      if (
        person.deathDate &&
        new Date() >= person.deathDate
      ) {

        status.textContent =
          "YES";

        status.style.color =
          "#ff5c5c";

      } else {

        status.textContent =
          "NO";

        status.style.color =
          "#45d483";

      }


      calculateAge(
        person.birthDate
      );


      updateCountdown();

    }


    // ==========================================
    // NEXT PERSON
    // ==========================================

    function nextPerson() {

      currentPerson++;


      if (
        currentPerson >= people.length
      ) {

        currentPerson = 0;

      }


      displayPerson();

    }


    // ==========================================
    // PREVIOUS PERSON
    // ==========================================

    function previousPerson() {

      currentPerson--;


      if (currentPerson < 0) {

        currentPerson =
          people.length - 1;

      }


      displayPerson();

    }


    // ==========================================
    // GOON COUNTER
    // ==========================================

    const GOON_LIMIT = 500;

    let goonCount = 0;

    let lastGoonDay =
      new Date().toDateString();


    // ==========================================
    // UPDATE GOON DISPLAY
    // ==========================================

    function updateGoonCounter() {

      goonNumber.textContent =
        goonCount;

    }


    // ==========================================
    // CHECK FOR NEW DAY
    // ==========================================

    function checkGoonDay() {

      const today =
        new Date().toDateString();


      if (today !== lastGoonDay) {

        goonCount = 0;

        lastGoonDay = today;

        updateGoonCounter();

      }

    }


    // ==========================================
    // INCREASE GOON COUNTER
    // ==========================================

    function increaseGoonCounter() {

      checkGoonDay();


      // Stop at 500

      if (goonCount >= GOON_LIMIT) {

        goonCount =
          GOON_LIMIT;

        updateGoonCounter();

        return;

      }


      // Random number between 1 and 10

      const increase =
        Math.floor(
          Math.random() * 10
        ) + 1;


      goonCount += increase;


      // Never go above 500

      if (goonCount > GOON_LIMIT) {

        goonCount =
          GOON_LIMIT;

      }


      updateGoonCounter();

    }


    // ==========================================
    // START
    // ==========================================

    displayPerson();

    updateGoonCounter();


    // ==========================================
    // UPDATE DEATH COUNTDOWN EVERY SECOND
    // ==========================================

    setInterval(

      function() {

        displayPerson();

      },

      1000

    );


    // ==========================================
    // INCREASE GOON COUNTER EVERY 30 MINUTES
    // ==========================================

    setInterval(

      function() {

        increaseGoonCounter();

      },

      30 * 60 * 1000

    );


    // ==========================================
    // CHECK FOR NEW DAY EVERY MINUTE
    // ==========================================

    setInterval(

      function() {

        checkGoonDay();

      },

      60 * 1000

    );

  </script>

</body>

</html>
