<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Is Jamie Dead?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 5px;
    }

    .status {
      font-size: 5rem;
      font-weight: bold;
      margin: 20px 0;
    }

    .subtitle {
      color: #777;
      font-size: 0.9rem;
    }

    .updated {
      margin-top: 25px;
      color: #555;
      font-size: 0.75rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Is Jamie Dead?</h1>

    <div class="status" id="status"></div>

    <div class="subtitle">
      Extremely reliable information
    </div>

    <div class="updated">
      Last checked: Definitely
    </div>
  </div>

  <script>
    // ==========================================
    // CHANGE THIS TO "YES" OR "NO"
    // ==========================================

    const isDead = "NO";

    // ==========================================

    const status = document.getElementById("status");

    if (isDead === "YES") {
      status.textContent = "YES";
      status.style.color = "#ff5c5c";
    } else {
      status.textContent = "NO";
      status.style.color = "#45d483";
    }
  </script>

</body>
</html>
